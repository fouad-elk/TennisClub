<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page introuvable</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FDF6F0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
        }
        .error-box {
            background: white; padding: 60px 48px; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border-top: 6px solid #C1440E; max-width: 480px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 5rem; font-weight: 800; color: #C1440E; line-height: 1;
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600; color: #2D5016; margin: 12px 0 16px; font-size: 1.3rem;
        }
        p { color: #666; margin-bottom: 28px; }
        a {
            display: inline-block; padding: 12px 32px;
            background: #2D5016; color: white; border-radius: 10px;
            text-decoration: none; font-weight: 600; transition: background 0.2s;
        }
        a:hover { background: #1e3a0f; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <h2>Balle dehors !</h2>
        <p>La page que tu cherches n'existe pas ou a été déplacée.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
