{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Tennis Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'reservations/css/style.css' %}">
</head>
<body class="login-page">

    <!-- Carte de connexion centrée -->
    <div class="login-box fade-in">

        <!-- Logo du club -->
        <div class="login-logo">
            <div class="logo-ball">
                <i class="fas fa-baseball-ball"></i>
            </div>
            <h1>Tennis Club</h1>
            <span class="saison">Saison 2025 — 2026</span>
        </div>

        <!-- Erreurs de connexion -->
        {% if messages %}
            {% for m in messages %}
                <div class="alert-box alert-error">
                    <i class="fas fa-exclamation-circle"></i> {{ m }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulaire de connexion -->
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_numero">Numéro d'affiliation</label>
                <input type="text" id="id_numero" name="numero_affiliation" maxlength="7"
                       required placeholder="Ex : 1234567"
                       value="{{ form.numero_affiliation.value|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                <input type="password" id="id_password" name="password" required
                       placeholder="Ton mot de passe">
            </div>
            <button type="submit" class="btn btn-terre" style="width:100%; padding:14px; font-size:0.92em; margin-top:8px;">
                SE CONNECTER
            </button>
        </form>

        <div class="link-bottom">
            <a href="{% url 'premiere_connexion' %}">Première connexion ? Crée ton mot de passe ici</a>
        </div>
        <div class="link-bottom" style="margin-top: 6px;">
            <a href="{% url 'mdp_oublie' %}" style="color: var(--gris-filet, #888);">
                <i class="fas fa-key"></i> Mot de passe oublié ?
            </a>
        </div>
    </div>

</body>
</html>
