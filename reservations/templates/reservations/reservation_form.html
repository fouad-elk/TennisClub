<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle Réservation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1EFE7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; width: 450px; border-radius: 20px; border-top: 10px solid #CB5A27; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #004225; text-align: center; }
        .form-input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        .btn { background: #004225; color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Faire une réservation</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">CONFIRMER</button>
        </form>
        <p style="text-align: center; margin-top: 20px;"><a href="{% url 'home' %}" style="color: grey;">Retour</a></p>
    </div>
</body>
</html>
